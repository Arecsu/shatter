; Shatter settings. This file is optional: without it everything below is at its default.
; Put it next to PhysXLoader.dll (the game's Binaries folder). Remove the ';' in front of a line to use it.

[shatter]
; Fluids (glass shards, debris, smoke, steam):
;   on            Shatter runs all of them (default)
;   collide-only  Shatter runs debris and glass only; smoke and steam stay on the original PhysX
;   off           all fluids on the original PhysX
;fluid = on

; Cloth (banners, flags, plastic sheets): on (default) or off (original PhysX).
;cloth = on

; Cloth improvements that are not in the original (on by default):
;   cloth_edge_contact  cloth edges don't hang on thin bars
;   cloth_self_contact  cloth folding on itself doesn't pass through itself
;cloth_edge_contact = on
;cloth_self_contact = on

; Game fix, off by default because it changes player movement: steering left/right on steep slides (the chapter 1
; building slide) works above 62 fps as it does at 62. Without it, steering all but disappears at high frame rates
; (seen at 240 and 300 fps). Only for the GOG 1.0.1.0 game build; other builds are left untouched.
;slide_steering_fix = on

; Worker threads for fluids and cloth: auto (default, about half the CPU threads minus one, at most 8) or a number.
;threads = auto

; Debug: writes PhysXLoader_shim.log next to the DLL (for bug reports).
;debug_log = off
